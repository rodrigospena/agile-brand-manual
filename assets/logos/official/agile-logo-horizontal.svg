<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-h-official {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 104px;
        letter-spacing: 0.16em;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  
  <!-- Símbolo à Esquerda -->
  <g transform="translate(180, 180) scale(0.48) translate(-400, -380)">
    
    <!-- Outer "A" Frame with Chamfered Modern Peak -->
    <polygon points="400,100 620,680 495,680 435,530 365,530 305,680 180,680" fill="#0B1B3D" />
    
    <!-- Central Isometric Building -->
    <polygon points="400,290 475,335 400,380 325,335" fill="#FF9D54" />
    <polygon points="325,335 400,380 400,680 325,680" fill="#FF6B00" />
    <polygon points="400,380 475,335 475,680 400,680" fill="#162C5B" />
    
    <!-- 4 Clean Architectural Floor Louver Slots -->
    <polygon points="325,390 400,435 400,455 325,410" fill="#FFFFFF" />
    <polygon points="325,465 400,510 400,530 325,485" fill="#FFFFFF" />
    <polygon points="325,540 400,585 400,605 325,560" fill="#FFFFFF" />
    <polygon points="325,615 400,660 400,678 325,633" fill="#FFFFFF" />
  
  </g>
  
  <!-- Nome Oficial AGILE à Direita (Sem Slogan) -->
  <text x="380" y="180" class="brand-title-h-official" fill="#0B1B3D">AGILE</text>
</svg>