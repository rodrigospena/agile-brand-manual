<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <path id="stampTopArc" d="M 72,300 A 228,228 0 0,1 528,300" fill="none"/>
    <path id="stampBotArc" d="M 528,300 A 228,228 0 0,1 72,300" fill="none"/>
  </defs>
  
  <!-- Anéis Estruturais de Engenharia -->
  <circle cx="300" cy="300" r="282" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="300" cy="300" r="264" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="9 6"/>
  <circle cx="300" cy="300" r="188" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Tipografia Circular AGILE (Ampliada & Imponente) -->
  <text font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, sans-serif" font-weight="900" font-size="42px" letter-spacing="0.26em" fill="#FFFFFF">
    <textPath href="#stampTopArc" startOffset="50%" text-anchor="middle">AGILE</textPath>
  </text>
  
  <!-- Tipografia Circular ENGENHARIA CIVIL (Ampliada & Nítida) -->
  <text font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, sans-serif" font-weight="800" font-size="22px" letter-spacing="0.20em" fill="#FFA768">
    <textPath href="#stampBotArc" startOffset="50%" text-anchor="middle">ENGENHARIA CIVIL</textPath>
  </text>
  
  <!-- Marcadores / Delimitadores de Eixo -->
  <circle cx="72" cy="300" r="7" fill="#FF6B00"/>
  <circle cx="528" cy="300" r="7" fill="#FF6B00"/>
  
  <!-- Símbolo Central Ampliado (scale 0.40 no núcleo) -->
  <g transform="translate(300, 304) scale(0.40) translate(-400, -380)">
    
    <!-- Outer "A" Architectural Frame (Option C: Gap 60px) -->
    <polygon points="400,100 620,680 535,680 445,495 355,495 265,680 180,680" fill="#FFFFFF" />
    
    <!-- Central Isometric Building Structure -->
    <polygon points="400,290 475,335 400,380 325,335" fill="#FF9D54" />
    <polygon points="325,335 400,380 400,680 325,680" fill="#FF6B00" />
    <polygon points="400,380 475,335 475,680 400,680" fill="#FFA768" />
    
    <!-- 4 Clean Architectural Floor Louver Slots -->
    <polygon points="325,390 400,435 400,455 325,410" fill="#0B1B3D" />
    <polygon points="325,465 400,510 400,530 325,485" fill="#0B1B3D" />
    <polygon points="325,540 400,585 400,605 325,560" fill="#0B1B3D" />
    <polygon points="325,615 400,660 400,678 325,633" fill="#0B1B3D" />
  
  </g>
</svg>