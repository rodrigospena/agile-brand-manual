<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: 0.14em;
      }
      .brand-subtitle-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>
  
  
  <g transform="translate(180, 200) scale(0.48) translate(-400, -380)">
    
    <!-- Sharp Tower Skyline Inside A Silhouette -->
    <polygon points="400,80 630,680 510,680 440,530 360,530 290,680 170,680" 
      fill="none" stroke="#0B1B3D" stroke-width="24" stroke-linejoin="round" />
    <!-- Vertical High-Rise Tower Spine -->
    <polygon points="400,180 450,260 450,680 350,680 350,260" fill="#FF6B00" />
    <polygon points="400,180 450,260 400,290 350,260" fill="#FFA566" />
    <!-- Window Grid Louvers -->
    <line x1="370" y1="360" x2="430" y2="360" stroke="#FFFFFF" stroke-width="8" />
    <line x1="370" y1="430" x2="430" y2="430" stroke="#FFFFFF" stroke-width="8" />
    <line x1="370" y1="500" x2="430" y2="500" stroke="#FFFFFF" stroke-width="8" />
    <line x1="370" y1="570" x2="430" y2="570" stroke="#FFFFFF" stroke-width="8" />
  
  </g>
  
  <line x1="390" y1="80" x2="390" y2="320" stroke="#64748B" stroke-width="2" opacity="0.35"/>
  <text x="440" y="210" class="brand-title-h" fill="#0B1B3D">AGILE</text>
  <text x="445" y="268" class="brand-subtitle-h" fill="#FF6B00">ENGENHARIA E REGULARIZAÇÃO</text>
</svg>