<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 88px;
        letter-spacing: 0.16em;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
        text-anchor: middle;
      }
    </style>
  </defs>
  
  <g transform="translate(400, 370) scale(0.85) translate(-400, -380)">
    
    <!-- Letra "A" Externa -->
    <polygon points="400,90 630,680 500,680 440,540 360,540 300,680 170,680" fill="#0B1B3D" />
    
    <!-- Edifício Central Limpo (Sem Losangos) -->
    <!-- Topo Isométrico -->
    <polygon points="400,260 470,305 400,350 330,305" fill="#FFA559" />
    
    <!-- Fachada Esquerda em Laranja Puro com 3 frisos horizontais retos -->
    <polygon points="330,305 400,350 400,680 330,680" fill="#FF6B00" />
    <line x1="330" y1="400" x2="400" y2="445" stroke="#FFFFFF" stroke-width="8" />
    <line x1="330" y1="470" x2="400" y2="515" stroke="#FFFFFF" stroke-width="8" />
    <line x1="330" y1="540" x2="400" y2="585" stroke="#FFFFFF" stroke-width="8" />
    
    <!-- Fachada Direita em Azul Sólido -->
    <polygon points="400,350 470,305 470,680 400,680" fill="#18316B" />

    <!-- Mão Esquerda Elegante (Curvatura natural abraçando o prédio) -->
    <path d="M 170,680 
             C 210,630 250,560 300,520 
             C 315,505 325,480 330,460 
             C 330,490 325,520 310,545 
             C 275,600 240,650 220,680 Z" 
          fill="#FF6B00" />
    <path d="M 330,460 C 315,485 305,515 315,535 C 325,515 328,490 330,460 Z" fill="#D95200" />

    <!-- Mão Direita Elegante (Simétrica abraçando o prédio) -->
    <path d="M 630,680 
             C 590,630 550,560 500,520 
             C 485,505 475,480 470,460 
             C 470,490 475,520 490,545 
             C 525,600 560,650 580,680 Z" 
          fill="#FF6B00" />
    <path d="M 470,460 C 485,485 495,515 485,535 C 475,515 472,490 470,460 Z" fill="#D95200" />
  
  </g>
  <text x="400" y="780" class="brand-title" fill="#0B1B3D">AGILE</text>
  <line x1="120" y1="835" x2="220" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
  <text x="400" y="842" class="brand-subtitle" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
  <line x1="580" y1="835" x2="680" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
</svg>