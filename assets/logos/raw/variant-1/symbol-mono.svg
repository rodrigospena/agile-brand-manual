<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  
  <g id="agile-symbol-v1">
    
    <!-- Outer "A" Architectural Frame -->
    <polygon points="400,90 630,680 490,680 435,540 365,540 310,680 170,680" fill="#000000" />
    
    <!-- Subtle Upward Growth / Arrow in the Apex -->
    <polygon points="400,160 445,260 400,240 355,260" fill="#334155" opacity="0.35" />
    
    <!-- Isometric Roof / Cap -->
    <polygon points="400,280 470,325 400,365 330,325" fill="#94A3B8" />
    
