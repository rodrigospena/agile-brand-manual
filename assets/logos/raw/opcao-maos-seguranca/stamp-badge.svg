<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .stamp-text {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 0.25em;
        fill: #0B1B3D;
      }
      .stamp-sub {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.22em;
        fill: #FF6B00;
      }
    </style>
    <path id="cTop" d="M 100,300 A 200,200 0 0,1 500,300" fill="none"/>
    <path id="cBot" d="M 500,300 A 200,200 0 0,1 100,300" fill="none"/>
  </defs>
  
  <circle cx="300" cy="300" r="280" fill="none" stroke="#0B1B3D" stroke-width="5"/>
  <circle cx="300" cy="300" r="262" fill="none" stroke="#0B1B3D" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="300" cy="300" r="175" fill="none" stroke="#0B1B3D" stroke-width="2.5"/>
  <text class="stamp-text">
    <textPath href="#cTop" startOffset="50%" text-anchor="middle">AGILE ENGENHARIA</textPath>
  </text>
  <text class="stamp-sub">
    <textPath href="#cBot" startOffset="50%" text-anchor="middle">REGULARIZAÇÃO DE IMÓVEIS</textPath>
  </text>
  <circle cx="95" cy="300" r="6" fill="#FF6B00"/>
  <circle cx="505" cy="300" r="6" fill="#FF6B00"/>
  <g transform="translate(300, 305) scale(0.32) translate(-400, -380)">
    
    <!-- Letter "A" Silhouette -->
    <polygon points="400,90 630,680 500,680 440,540 360,540 300,680 170,680" fill="#0B1B3D" />
    
    <!-- Central Tower -->
    <polygon points="400,260 475,310 400,360 325,310" fill="#FFA559" />
    <polygon points="325,310 400,360 400,680 325,680" fill="#FF6B00" />
    <polygon points="400,360 475,310 475,680 400,680" fill="#18316B" />
    
    <!-- Louvers -->
    <polygon points="325,375 365,350 400,420 360,445" fill="#FFFFFF" />
    <polygon points="325,455 365,430 400,500 360,525" fill="#FFFFFF" />
    <polygon points="325,535 365,510 400,580 360,605" fill="#FFFFFF" />
    <polygon points="325,615 365,590 400,660 360,680" fill="#FFFFFF" />

    <!-- Left Faceted Geometric Hand (Cupping Upward) -->
    <polygon points="325,470 280,520 220,680 285,680 325,530" fill="#FF6B00" />
    <polygon points="325,530 285,680 330,680 330,590" fill="#D95200" />
    <polygon points="325,470 305,485 300,510 325,500" fill="#D95200" />

    <!-- Right Faceted Geometric Hand (Cupping Upward) -->
    <polygon points="475,470 520,520 580,680 515,680 475,530" fill="#FF6B00" />
    <polygon points="475,530 515,680 470,680 470,590" fill="#D95200" />
    <polygon points="475,470 495,485 500,510 475,500" fill="#D95200" />
  
  </g>
</svg>