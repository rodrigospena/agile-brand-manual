<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: 0.14em;
      }
      .brand-subtitle-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>
  
  
  <g transform="translate(180, 200) scale(0.48) translate(-400, -380)">
    
    <!-- Isometric Orange Frame Behind -->
    <polygon points="400,160 560,260 560,520 400,620 240,520 240,260" 
      fill="none" stroke="#FF6B00" stroke-width="22" stroke-linejoin="round" />
    <line x1="400" y1="160" x2="400" y2="620" stroke="#FF6B00" stroke-width="16" stroke-dasharray="16 12" />
    <!-- Dominant Interlocking A in Front -->
    <polygon points="400,100 630,680 500,680 440,530 360,530 300,680 170,680" 
      fill="#0B1B3D" />
    <polygon points="400,250 445,360 355,360" fill="#FFFFFF" />
  
  </g>
  
  <line x1="390" y1="80" x2="390" y2="320" stroke="#64748B" stroke-width="2" opacity="0.35"/>
  <text x="440" y="210" class="brand-title-h" fill="#0B1B3D">AGILE</text>
  <text x="445" y="268" class="brand-subtitle-h" fill="#FF6B00">ENGENHARIA E REGULARIZAÇÃO</text>
</svg>