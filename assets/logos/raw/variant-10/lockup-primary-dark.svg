<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 88px;
        letter-spacing: 0.16em;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
        text-anchor: middle;
      }
    </style>
  </defs>
  <rect width="800" height="1000" fill="#0B1B3D"/>
  
  <g transform="translate(400, 370) scale(0.85) translate(-400, -380)">
    
    <!-- Outer Arch Frame -->
    <polygon points="400,90 620,680 490,680 440,540 360,540 310,680 180,680" fill="#FFFFFF" />
    <!-- 3D Hexagonal Solid Prism -->
    <polygon points="400,260 480,310 400,360 320,310" fill="#FFA768" />
    <polygon points="320,310 400,360 400,680 320,630" fill="#FF6B00" />
    <polygon points="400,360 480,310 480,630 400,680" fill="#E65100" />
    <!-- 3 Clean Technical Windows -->
    <polygon points="340,360 385,390 385,420 340,390" fill="#FFFFFF" />
    <polygon points="340,440 385,470 385,500 340,470" fill="#FFFFFF" />
    <polygon points="340,520 385,550 385,580 340,550" fill="#FFFFFF" />
  
  </g>
  
  <text x="400" y="780" class="brand-title" fill="#FFFFFF">AGILE</text>
  <line x1="120" y1="835" x2="220" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
  <text x="400" y="842" class="brand-subtitle" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
  <line x1="580" y1="835" x2="680" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
</svg>