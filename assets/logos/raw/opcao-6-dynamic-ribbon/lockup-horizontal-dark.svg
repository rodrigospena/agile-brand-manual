<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: 0.14em;
      }
      .brand-subtitle-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>
  <rect width="1200" height="400" fill="#0B1B3D"/>
  <g transform="translate(180, 200) scale(0.48) translate(-400, -380)">
    
    <polygon points="400,90 630,680 500,680 440,540 360,540 300,680 170,680" fill="#FFFFFF" />
    
    <!-- Edifício Limpo -->
    <polygon points="400,260 470,305 400,350 330,305" fill="#FFA559" />
    <polygon points="330,305 400,350 400,680 330,680" fill="#FF6B00" />
    <polygon points="400,350 470,305 470,680 400,680" fill="#1E3A8A" />
    
    <!-- 3 Linhas Horizontais Limpas na Fachada -->
    <line x1="330" y1="400" x2="400" y2="445" stroke="#FFFFFF" stroke-width="8" />
    <line x1="330" y1="470" x2="400" y2="515" stroke="#FFFFFF" stroke-width="8" />
    <line x1="330" y1="540" x2="400" y2="585" stroke="#FFFFFF" stroke-width="8" />

    <!-- Fitas Curvas em 3D Suaves -->
    <path d="M 330,520 C 270,510 220,570 170,680 L 230,680 C 270,600 300,560 330,545 Z" fill="#D95200" />
    <path d="M 330,470 C 260,480 210,550 170,680 L 240,680 C 270,580 300,530 330,500 Z" fill="#FF6B00" />

    <path d="M 470,520 C 530,510 580,570 630,680 L 570,680 C 530,600 500,560 470,545 Z" fill="#D95200" />
    <path d="M 470,470 C 540,480 590,550 630,680 L 560,680 C 530,580 500,530 470,500 Z" fill="#FF6B00" />
  
  </g>
  <line x1="390" y1="80" x2="390" y2="320" stroke="#64748B" stroke-width="2" opacity="0.35"/>
  <text x="440" y="210" class="brand-title-h" fill="#FFFFFF">AGILE</text>
  <text x="445" y="268" class="brand-subtitle-h" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
</svg>