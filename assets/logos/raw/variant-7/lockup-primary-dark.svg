<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 88px;
        letter-spacing: 0.16em;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
        text-anchor: middle;
      }
    </style>
  </defs>
  <rect width="800" height="1000" fill="#0B1B3D"/>
  
  <g transform="translate(400, 370) scale(0.85) translate(-400, -380)">
    
    <!-- Ultra Clean Solid "A" with precise negative building cutout -->
    <polygon points="400,90 640,680 510,680 440,520 360,520 290,680 160,680" fill="#FFFFFF" />
    <!-- Negative Space Cutout for Building -->
    <polygon points="400,280 460,320 460,680 340,680 340,320" fill="#FFFFFF" />
    <!-- Orange Accent Cube inside Cutout -->
    <polygon points="400,310 445,340 400,370 355,340" fill="#FF6B00" />
    <polygon points="355,340 400,370 400,680 355,680" fill="#FF6B00" />
    <polygon points="400,370 445,340 445,680 400,680" fill="#E65100" />
  
  </g>
  
  <text x="400" y="780" class="brand-title" fill="#FFFFFF">AGILE</text>
  <line x1="120" y1="835" x2="220" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
  <text x="400" y="842" class="brand-subtitle" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
  <line x1="580" y1="835" x2="680" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
</svg>