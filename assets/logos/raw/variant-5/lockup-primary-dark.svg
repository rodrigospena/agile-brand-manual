<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 88px;
        letter-spacing: 0.16em;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0.28em;
        text-anchor: middle;
      }
    </style>
  </defs>
  <rect width="800" height="1000" fill="#0B1B3D"/>
  
  <!-- Símbolo Centralizado (Escala 0.78) -->
  <g transform="translate(400, 370) scale(0.85) translate(-400, -380)">
    
    <!-- Drafting Compass A Outline with Technical Linework -->
    <polygon points="400,90 630,680 490,680 435,540 365,540 310,680 170,680" 
      fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" />
    
    <!-- Inner Technical Isometric Solid -->
    <polygon points="400,290 470,335 400,375 330,335" fill="#FF6B00" opacity="0.9" />
    <polygon points="330,335 400,375 400,670 330,670" fill="#FF6B00" />
    <polygon points="400,375 470,335 470,670 400,670" fill="#FF6B00" opacity="0.8" />
    
    <!-- Precision Louver Lines in White -->
    <line x1="330" y1="410" x2="400" y2="450" stroke="#FFFFFF" stroke-width="12" />
    <line x1="330" y1="475" x2="400" y2="515" stroke="#FFFFFF" stroke-width="12" />
    <line x1="330" y1="540" x2="400" y2="580" stroke="#FFFFFF" stroke-width="12" />
    <line x1="330" y1="605" x2="400" y2="645" stroke="#FFFFFF" stroke-width="12" />
  
  </g>
  
  <!-- Logotipo Oficial Agile (SEM ACENTO) -->
  <text x="400" y="780" class="brand-title" fill="#FFFFFF">AGILE</text>
  
  <!-- Linhas de Apoio e Tagline -->
  <line x1="120" y1="835" x2="220" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
  <text x="400" y="842" class="brand-subtitle" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
  <line x1="580" y1="835" x2="680" y2="835" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>
</svg>