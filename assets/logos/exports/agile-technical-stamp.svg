<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .stamp-text {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 0.25em;
        fill: #0B1B3D;
      }
      .stamp-sub {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.22em;
        fill: #FF6B00;
      }
    </style>
    <!-- Trajetos Circulares para Texto em Curva -->
    <path id="circleTop" d="M 100,300 A 200,200 0 0,1 500,300" fill="none"/>
    <path id="circleBottom" d="M 500,300 A 200,200 0 0,1 100,300" fill="none"/>
  </defs>
  
  
  <!-- Círculos de Carimbo Técnico -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#0B1B3D" stroke-width="5"/>
  <circle cx="300" cy="300" r="262" fill="none" stroke="#0B1B3D" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="300" cy="300" r="175" fill="none" stroke="#0B1B3D" stroke-width="2.5"/>
  
  <!-- Textos Circulares -->
  <text class="stamp-text">
    <textPath href="#circleTop" startOffset="50%" text-anchor="middle">
      AGILE ENGENHARIA
    </textPath>
  </text>
  
  <text class="stamp-sub">
    <textPath href="#circleBottom" startOffset="50%" text-anchor="middle">
      REGULARIZAÇÃO DE IMÓVEIS
    </textPath>
  </text>
  
  <!-- Pontos Decorativos -->
  <circle cx="95" cy="300" r="6" fill="#FF6B00"/>
  <circle cx="505" cy="300" r="6" fill="#FF6B00"/>
  
  <!-- Símbolo Central -->
  <g transform="translate(300, 305) scale(0.32) translate(-400, -380)">
    
    <!-- Outer "A" Architectural Frame -->
    <polygon points="400,90 630,680 490,680 435,540 365,540 310,680 170,680" fill="#0B1B3D" />
    
    <!-- Subtle Upward Growth / Arrow in the Apex -->
    <polygon points="400,160 445,260 400,240 355,260" fill="#1D3B7A" opacity="0.35" />
    
    <!-- Isometric Roof / Cap -->
    <polygon points="400,280 470,325 400,365 330,325" fill="#FFA059" />
    
    <!-- Left Isometric Facade (Technical Louvers) -->
    <polygon points="330,325 400,365 400,680 330,680" fill="#FF6B00" />
    
    <!-- Right Isometric Facade (Structural Solid Wall) -->
    <polygon points="400,365 470,325 470,680 400,680" fill="#E65100" />
    
    <!-- 5 Horizontal Louver Slots -->
    <polygon points="330,375 400,415 400,430 330,390" fill="#FFFFFF" />
    <polygon points="330,435 400,475 400,490 330,450" fill="#FFFFFF" />
    <polygon points="330,495 400,535 400,550 330,510" fill="#FFFFFF" />
    <polygon points="330,555 400,595 400,610 330,570" fill="#FFFFFF" />
    <polygon points="330,615 400,655 400,670 330,630" fill="#FFFFFF" />
  
  </g>
</svg>