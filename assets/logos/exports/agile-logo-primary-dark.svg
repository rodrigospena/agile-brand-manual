<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-master {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 92px;
        letter-spacing: 0.18em;
        text-anchor: middle;
      }
      .brand-subtitle-master {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.28em;
        text-anchor: middle;
      }
    </style>
  </defs>
  <rect width="800" height="1000" fill="#0B1B3D"/>
  
  <!-- Símbolo Centralizado -->
  <g transform="translate(400, 360) scale(0.85) translate(-400, -380)">
    
    <!-- Outer "A" Architectural Frame -->
    <polygon points="400,60 660,700 520,700 440,510 360,510 280,700 140,700" fill="#FFFFFF" />
    
    <!-- Central Isometric Tower -->
    <!-- Top Roof Diamond -->
    <polygon points="400,270 475,320 400,370 325,320" fill="#FFA559" />
    
    <!-- Left Orange Facade (Divided by 4 Clean Diagonal White Bands) -->
    <!-- Segment 1 (Top) -->
    <polygon points="325,320 400,370 400,405 325,355" fill="#FF6B00" />
    <!-- Segment 2 -->
    <polygon points="325,380 400,430 400,480 325,430" fill="#FF6B00" />
    <!-- Segment 3 -->
    <polygon points="325,455 400,505 400,555 325,505" fill="#FF6B00" />
    <!-- Segment 4 (Bottom) -->
    <polygon points="325,530 400,580 400,680 325,630" fill="#FF6B00" />
    
    <!-- Right Solid Deep Navy Facade -->
    <polygon points="400,370 475,320 475,630 400,680" fill="#0B1B3D" />
  
  </g>
  
  <!-- Tipografia Oficial AGILE (Sem acento) -->
  <text x="400" y="780" class="brand-title-master" fill="#FFFFFF">AGILE</text>
  
  <!-- Linhas e Tagline -->
  <line x1="120" y1="835" x2="160" y2="835" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" />
  <text x="400" y="842" class="brand-subtitle-master" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
  <line x1="640" y1="835" x2="680" y2="835" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" />
</svg>