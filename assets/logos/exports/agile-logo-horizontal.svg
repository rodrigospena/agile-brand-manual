<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: 0.16em;
      }
      .brand-subtitle-h {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>
  
  
  <!-- Símbolo à Esquerda -->
  <g transform="translate(180, 200) scale(0.48) translate(-400, -380)">
    
    <!-- Outer "A" Architectural Frame -->
    <polygon points="400,60 660,700 520,700 440,510 360,510 280,700 140,700" fill="#0B1B3D" />
    
    <!-- Central Isometric Tower -->
    <!-- Top Roof Diamond -->
    <polygon points="400,270 475,320 400,370 325,320" fill="#FFA559" />
    
    <!-- Left Orange Facade (Divided by 4 Clean Diagonal White Bands) -->
    <!-- Segment 1 (Top) -->
    <polygon points="325,320 400,370 400,405 325,355" fill="#FF6B00" />
    <!-- Segment 2 -->
    <polygon points="325,380 400,430 400,480 325,430" fill="#FF6B00" />
    <!-- Segment 3 -->
    <polygon points="325,455 400,505 400,555 325,505" fill="#FF6B00" />
    <!-- Segment 4 (Bottom) -->
    <polygon points="325,530 400,580 400,680 325,630" fill="#FF6B00" />
    
    <!-- Right Solid Deep Navy Facade -->
    <polygon points="400,370 475,320 475,630 400,680" fill="#061026" />
  
  </g>
  
  <!-- Divisor Vertical Técnico -->
  <line x1="390" y1="80" x2="390" y2="320" stroke="#64748B" stroke-width="2" opacity="0.35"/>
  
  <!-- Tipografia e Tagline à Direita -->
  <text x="440" y="210" class="brand-title-h" fill="#0B1B3D">AGILE</text>
  <text x="445" y="268" class="brand-subtitle-h" fill="#FF6B00">REGULARIZAÇÃO DE IMÓVEIS</text>
</svg>