<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Top Arc for AGILE (radius 220, clockwise) -->
    <path id="stampTopArc" d="M 70,300 A 230,230 0 1,1 530,300" fill="none"/>
    <!-- Bottom Arc for ENGENHARIA CIVIL (radius 230, counter-clockwise so text sits upright) -->
    <path id="stampBotArc" d="M 70,300 A 230,230 0 0,0 530,300" fill="none"/>
  </defs>
  
  <!-- Anéis Estruturais de Precisão (Double Ring Profissional) -->
  <circle cx="300" cy="300" r="285" fill="none" stroke="#0B1B3D" stroke-width="6"/>
  <circle cx="300" cy="300" r="270" fill="none" stroke="#0B1B3D" stroke-width="2"/>
  <circle cx="300" cy="300" r="176" fill="none" stroke="#0B1B3D" stroke-width="3"/>
  
  <!-- Tipografia Superior: AGILE (Extra Bold, Perfeita e Equilibrada) -->
  <text font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, sans-serif" font-weight="900" font-size="54px" letter-spacing="0.26em" fill="#0B1B3D">
    <textPath href="#stampTopArc" startOffset="50%" text-anchor="middle">AGILE</textPath>
  </text>
  
  <!-- Tipografia Inferior: ENGENHARIA CIVIL (Orientada para Leitura Natural Correta) -->
  <text font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, sans-serif" font-weight="800" font-size="25px" letter-spacing="0.22em" fill="#FF6B00">
    <textPath href="#stampBotArc" startOffset="50%" text-anchor="middle">ENGENHARIA CIVIL</textPath>
  </text>
  
  <!-- Marcadores Técnicos Laterais (Losangos Precisos com Ponto Central) -->
  <polygon points="70,290 80,300 70,310 60,300" fill="#FF6B00"/>
  <polygon points="530,290 540,300 530,310 520,300" fill="#FF6B00"/>
  
  <!-- Símbolo Central Magnificado (scale 0.46 perfeitamente centralizado no anel interior) -->
  <g transform="translate(300, 305) scale(0.46) translate(-400, -380)">
    
    <!-- Outer "A" Architectural Frame (Option C: Gap 60px) -->
    <polygon points="400,100 620,680 535,680 445,495 355,495 265,680 180,680" fill="#0B1B3D" />
    
    <!-- Central Isometric Building Structure -->
    <polygon points="400,290 475,335 400,380 325,335" fill="#FF9D54" />
    <polygon points="325,335 400,380 400,680 325,680" fill="#FF6B00" />
    <polygon points="400,380 475,335 475,680 400,680" fill="#162C5B" />
    
    <!-- 4 Clean Architectural Floor Louver Slots -->
    <polygon points="325,390 400,435 400,455 325,410" fill="#FFFFFF" />
    <polygon points="325,465 400,510 400,530 325,485" fill="#FFFFFF" />
    <polygon points="325,540 400,585 400,605 325,560" fill="#FFFFFF" />
    <polygon points="325,615 400,660 400,678 325,633" fill="#FFFFFF" />
  
  </g>
</svg>