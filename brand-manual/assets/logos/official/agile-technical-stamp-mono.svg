<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Text Arcs (radius r=222) -->
    <path id="stampTopArc" d="M 78,300 A 222,222 0 0,1 522,300" fill="none"/>
    <path id="stampBotArc" d="M 522,300 A 222,222 0 0,1 78,300" fill="none"/>
  </defs>
  
  <!-- Anéis Estruturais de Precisão (Double Ring Profissional) -->
  <circle cx="300" cy="300" r="284" fill="none" stroke="#000000" stroke-width="6"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="300" cy="300" r="172" fill="none" stroke="#000000" stroke-width="3.5"/>
  
  <!-- Tipografia Superior: AGILE (Extra Grande, Bold e Impactante) -->
  <text font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, sans-serif" font-weight="900" font-size="52px" letter-spacing="0.28em" fill="#000000">
    <textPath href="#stampTopArc" startOffset="50%" text-anchor="middle">AGILE</textPath>
  </text>
  
  <!-- Tipografia Inferior: ENGENHARIA CIVIL (Grande, Nítida e Imponente) -->
  <text font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, sans-serif" font-weight="800" font-size="25px" letter-spacing="0.22em" fill="#000000">
    <textPath href="#stampBotArc" startOffset="50%" text-anchor="middle">ENGENHARIA CIVIL</textPath>
  </text>
  
  <!-- Marcadores / Delimitadores Geométricos em Losango/Ponto -->
  <polygon points="78,290 88,300 78,310 68,300" fill="#000000"/>
  <polygon points="522,290 532,300 522,310 512,300" fill="#000000"/>
  
  <!-- Símbolo Central Magnificado (scale 0.47 preenchendo o núcleo de raio 172) -->
  <g transform="translate(300, 305) scale(0.47) translate(-400, -380)">
    
    <!-- Outer "A" Architectural Frame (Option C: Gap 60px) -->
    <polygon points="400,100 620,680 535,680 445,495 355,495 265,680 180,680" fill="#000000" />
    
    <!-- Central Isometric Building Structure -->
    <polygon points="400,290 475,335 400,380 325,335" fill="#94A3B8" />
    <polygon points="325,335 400,380 400,680 325,680" fill="#000000" />
    <polygon points="400,380 475,335 475,680 400,680" fill="#64748B" />
    
    <!-- 4 Clean Architectural Floor Louver Slots -->
    <polygon points="325,390 400,435 400,455 325,410" fill="#FFFFFF" />
    <polygon points="325,465 400,510 400,530 325,485" fill="#FFFFFF" />
    <polygon points="325,540 400,585 400,605 325,560" fill="#FFFFFF" />
    <polygon points="325,615 400,660 400,678 325,633" fill="#FFFFFF" />
  
  </g>
</svg>