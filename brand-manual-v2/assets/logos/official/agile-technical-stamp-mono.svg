<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="650" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
      .stamp-text { font-family: 'Plus Jakarta Sans', monospace, sans-serif; }
    </style>
  </defs>
  
  <!-- Borda Dupla Padrão ABNT / CREA -->
  <rect x="4" y="4" width="642" height="272" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="10" y="10" width="630" height="260" rx="3" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 3"/>
  
  <!-- Divisória Vertical -->
  <line x1="200" y1="10" x2="200" y2="270" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Bloco Símbolo -->
  <g transform="translate(105, 115) scale(0.24) translate(-400, -380)">
    
    <!-- Hastes Estruturais do "A" (Esbeltas, topo chanfrado moderno, vão interno amplo) -->
    <polygon points="400,105 615,680 535,680 445,445 355,445 265,680 185,680" fill="#000000" />
    
    <!-- Topo Isométrico 100% Integrado à Fita Ascendente (Sem bloco flutuante) -->
    <polygon points="400,285 470,332 400,378 330,332" fill="#94A3B8" />
    
    <!-- Coluna / Fita Contínua Ascendente de Evolução -->
    <polygon points="330,332 400,378 400,680 330,680" fill="#000000" />
    <polygon points="400,378 470,332 470,680 400,680" fill="#475569" />
    
    <!-- Ranhura Negativa de Precisão Arquitetônica (Respiro dinâmico do travessão) -->
    <polygon points="330,490 400,532 400,548 330,506" fill="#FFFFFF" />
    <polygon points="400,532 470,490 470,506 400,548" fill="#FFFFFF" />
  
  </g>
  <text x="105" y="210" class="stamp-text" font-weight="800" font-size="20" letter-spacing="0.1em" text-anchor="middle" fill="#000000">AGILE</text>
  <text x="105" y="230" class="stamp-text" font-weight="600" font-size="10" letter-spacing="0.15em" text-anchor="middle" fill="#000000">ENGENHARIA</text>
  
  <!-- Bloco Dados Técnicos -->
  <text x="220" y="45" class="stamp-text" font-weight="800" font-size="14" fill="#000000">AGILE ENGENHARIA &amp; REGULARIZAÇÃO LTDA.</text>
  <line x1="220" y1="55" x2="620" y2="55" stroke="#000000" stroke-width="0.75"/>
  
  <text x="220" y="80" class="stamp-text" font-weight="700" font-size="11" fill="#475569">PROJETO / FINALIDADE:</text>
  <text x="365" y="80" class="stamp-text" font-weight="700" font-size="11" fill="#000000">LEGALIZAÇÃO &amp; HABITE-SE</text>
  
  <text x="220" y="110" class="stamp-text" font-weight="700" font-size="11" fill="#475569">RESPONSÁVEL TÉCNICO:</text>
  <text x="365" y="110" class="stamp-text" font-weight="700" font-size="11" fill="#000000">ENG. CIVIL / CREA-SP</text>
  
  <text x="220" y="140" class="stamp-text" font-weight="700" font-size="11" fill="#475569">REGISTRO CREA / ART:</text>
  <text x="365" y="140" class="stamp-text" font-weight="700" font-size="11" fill="#000000">AUTENTICAÇÃO DIGITAL</text>
  
  <line x1="220" y1="160" x2="620" y2="160" stroke="#000000" stroke-width="0.75"/>
  
  <text x="220" y="185" class="stamp-text" font-weight="700" font-size="10" fill="#475569">ETAPA: REGULARIZAÇÃO PATRIMONIAL</text>
  <text x="480" y="185" class="stamp-text" font-weight="700" font-size="10" fill="#000000">APROVAÇÃO ÁGIL</text>
  
  <rect x="220" y="205" width="400" height="45" rx="4" fill="#F1F5F9" stroke="#000000" stroke-width="0.75"/>
  <text x="420" y="232" class="stamp-text" font-weight="700" font-size="11" letter-spacing="0.08em" text-anchor="middle" fill="#000000">AUTORIZADO PARA USO EM PRANCHA TÉCNICA</text>
</svg>