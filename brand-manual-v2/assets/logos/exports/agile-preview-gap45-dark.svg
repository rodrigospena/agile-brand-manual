    <!-- Central Isometric Building -->
    <polygon points="400,290 475,335 400,380 325,335" fill="#FFFFFF" />
    <polygon points="325,335 400,380 400,680 325,680" fill="#FF6B00" />
    <polygon points="400,380 475,335 475,680 400,680" fill="#FFA768" />
    
    <!-- 4 Clean Architectural Floor Louver Slots -->
    <polygon points="325,390 400,435 400,455 325,410" fill="#0B1B3D" />
    <polygon points="325,465 400,510 400,530 325,485" fill="#0B1B3D" />
    <polygon points="325,540 400,585 400,605 325,560" fill="#0B1B3D" />
    <polygon points="325,615 400,660 400,678 325,633" fill="#0B1B3D" />
  
  </g>
  
  <text x="400" y="770" class="brand-title-official" fill="#FFFFFF">AGILE</text>
