<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-title-h-v2 {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 78px;
        letter-spacing: 0.08em;
      }
      .brand-tagline-h-v2 {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.22em;
      }
    </style>
  </defs>
  
  <!-- Símbolo Redimensionado -->
  <g id="agile-symbol-h" transform="translate(130, 115) scale(0.25) translate(-400, -390)">
    
    <!-- Hastes Estruturais do "A" (Esbeltas, topo chanfrado moderno, vão interno amplo) -->
    <polygon points="400,105 615,680 535,680 445,445 355,445 265,680 185,680" fill="#FFFFFF" />
    
    <!-- Topo Isométrico 100% Integrado à Fita Ascendente (Sem bloco flutuante) -->
    <polygon points="400,285 470,332 400,378 330,332" fill="#E2E8F0" />
    
    <!-- Coluna / Fita Contínua Ascendente de Evolução -->
    <polygon points="330,332 400,378 400,680 330,680" fill="#FFFFFF" />
    <polygon points="400,378 470,332 470,680 400,680" fill="#CBD5E1" />
    
    <!-- Ranhura Negativa de Precisão Arquitetônica (Respiro dinâmico do travessão) -->
    <polygon points="330,490 400,532 400,548 330,506" fill="#071A33" />
    <polygon points="400,532 470,490 470,506 400,548" fill="#071A33" />
  
  </g>
  
  <!-- Naming & Tagline -->
  <text x="250" y="122" class="brand-title-h-v2" fill="#FFFFFF">AGILE</text>
  <text x="253" y="158" class="brand-tagline-h-v2" fill="#94A3B8">ENGENHARIA E REGULARIZAÇÃO</text>
</svg>